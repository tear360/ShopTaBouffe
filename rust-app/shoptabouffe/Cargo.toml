[package]
name = "shoptabouffe"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
