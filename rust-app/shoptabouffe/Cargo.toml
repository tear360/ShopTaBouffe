[package]
name = "shoptabouffe"
version = "1.0.10"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
image = "0.25"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
