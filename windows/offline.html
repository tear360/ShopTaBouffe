<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>ShopTaBouffe — hors connexion</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0c11; color: #f3f4f8; font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    .box { max-width: 420px; padding: 30px; }
    .big { font-size: 56px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #9ba3b2; line-height: 1.5; margin: 0 0 22px; }
    button {
      background: #ef6c33; color: #fff; border: none; border-radius: 12px;
      padding: 12px 26px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="box">
    <div class="big">📡</div>
    <h1>Impossible de joindre ShopTaBouffe</h1>
    <p>Vérifiez votre connexion à Internet, puis réessayez.<br />
       Le service est introuvable pour l’instant.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
